<div class="row g-4"> <div class="col-12 col-lg-6">
        <div class="card admin-card p-4 h-100">
            <h5 class="mb-4 text-success fw-bold"><i class="fas fa-door-open me-2"></i>Sınıf Tanımla</h5>
            <div class="mb-3">
                <input type="text" id="className" class="form-control form-control-lg" placeholder="Sınıf Adı (Örn: Arılar)">
            </div>
            <div class="mb-3">
                <input type="text" id="teacherName" class="form-control form-control-lg" placeholder="Sorumlu Öğretmen">
            </div>
            <button onclick="saveClass()" class="btn btn-success btn-lg w-100 shadow-sm mt-2">Sınıfı Kaydet</button>
        </div>
    </div>

    <div class="col-12 col-lg-6">
        <div class="card admin-card p-4 h-100">
            <h5 class="mb-4 text-primary fw-bold"><i class="fas fa-cube me-2"></i>Yeni Materyal</h5>
            <select id="lessonArea" class="form-select form-select-lg mb-3">
                <option>Günlük Yaşam</option>
                <option>Duyusal</option>
                <option>Matematik</option>
                <option>Dil</option>
                <option>Kültür</option>
            </select>
            <input type="text" id="lessonName" class="form-control form-control-lg mb-3" placeholder="Materyal Adı">
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-muted">Zorluk Seviyesi</label>
                <input type="range" id="difficulty" class="form-range" min="1" max="10">
            </div>
            <button onclick="saveLesson()" class="btn btn-primary btn-lg w-100 shadow-sm">Müfredata Ekle</button>
        </div>
    </div>
</div>
