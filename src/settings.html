<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori - Ayarlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #fdfaf5; font-family: 'Nunito', sans-serif; }
        .admin-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        /* Mobil için butonları ve inputları büyütüyoruz */
        .form-control, .form-select, .btn { padding: 12px; font-size: 16px; border-radius: 10px; }
        h2 { font-weight: 700; color: #4a5d4e; }
    </style>
</head>
<body class="p-3 p-md-5">

<div class="container">
    <div class="text-center mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm mb-2">← Panele Dön</a>
        <h2>Okul Yönetimi</h2>
        <p class="text-muted small">Sınıf ve materyal ayarlarını buradan yapın.</p>
    </div>

    <div class="row">
        <div class="col-12 col-md-6">
            <div class="card admin-card p-4">
                <h5 class="mb-3 text-success"><i class="fas fa-door-open me-2"></i>Sınıf Tanımla</h5>
                <input type="text" id="className" class="form-control mb-3" placeholder="Sınıf Adı">
                <input type="text" id="teacherName" class="form-control mb-3" placeholder="Öğretmen Adı">
                <button onclick="saveClass()" class="btn btn-success w-100 fw-bold">Sınıfı Kaydet</button>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card admin-card p-4">
                <h5 class="mb-3 text-primary"><i class="fas fa-book-open me-2"></i>Materyal Ekle</h5>
                <select id="lessonArea" class="form-select mb-3">
                    <option>Günlük Yaşam</option>
                    <option>Duyusal</option>
                    <option>Matematik</option>
                    <option>Dil</option>
                    <option>Kültür</option>
                </select>
                <input type="text" id="lessonName" class="form-control mb-3" placeholder="Materyal Adı">
                
                <label class="small text-muted mb-1">Zorluk Seviyesi (1-10)</label>
                <input type="range" id="difficulty" class="form-range mb-3" min="1" max="10" step="1">
                
                <button onclick="saveLesson()" class="btn btn-primary w-100 fw-bold">Müfredata Ekle</button>
            </div>
        </div>
    </div>
</div>

<script>
    // API fonksiyonları aynı kalacak, sadece difficulty ekliyoruz
    async function saveLesson() {
        const data = {
            area: document.getElementById('lessonArea').value,
            lessonName: document.getElementById('lessonName').value,
            difficultyLevel: document.getElementById('difficulty').value
        };
        const response = await fetch('/api/lessons', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        if(response.ok) alert("Materyal zorluk seviyesiyle beraber eklendi!");
    }
    // saveClass fonksiyonu aynı kalıyor
    async function saveClass() {
        const data = {
            className: document.getElementById('className').value,
            teacherName: document.getElementById('teacherName').value
        };
        await fetch('/api/classes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        alert("Sınıf başarıyla eklendi!");
    }
</script>
</body>
</html>
