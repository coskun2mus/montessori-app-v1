<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia - Gözlem Paneli</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --liberum-green: #4a5d4e; 
            --liberum-gold: #c5a059;
            --liberum-light: #fdfaf5; 
            --liberum-accent: #e9e0d2; 
        }
        
        body { background-color: var(--liberum-light); font-family: 'Nunito', sans-serif; padding-bottom: 110px; margin: 0; }
        
        /* LOGO VE ÜST ALAN */
        .hero-header {
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.95)), url('logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 5px solid var(--liberum-green);
        }

        .hero-title {
            color: var(--liberum-green);
            font-weight: 800;
            font-size: 1.8rem;
            margin-top: 130px; /* Logonun altına gelmesi için */
            letter-spacing: 1px;
            text-align: center;
        }

        /* SINIF SEÇİMİ (MERKEZİ) */
        .selection-container {
            max-width: 500px;
            margin: -35px auto 30px;
            padding: 0 20px;
            position: relative;
            z-index: 100;
        }

        .btn-class-selector {
            background-color: var(--liberum-green);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 50px;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .btn-class-selector:hover { background-color: #3d4d40; transform: translateY(-2px); color: white; }

        /* ÖĞRENCİ KARTLARI */
        .student-card { 
            border: none;
            border-left: 5px solid var(--liberum-gold);
            border-radius: 20px; 
            background: white; 
            transition: all 0.3s ease; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .student-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }

        .avatar { 
            background: var(--liberum-accent); color: var(--liberum-green); 
            width: 55px; height: 55px; display: flex; align-items: center; 
            justify-content: center; border-radius: 50%; font-weight: 800;
            font-size: 1.2rem;
        }

        /* MODAL */
        .modal-content { border-radius: 35px; border: none; }
        .btn-status { 
            padding: 16px; font-weight: bold; border-radius: 18px; 
            margin-bottom: 12px; width: 100%; text-align: left; 
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .btn-status:active { transform: scale(0.97); }
        
        /* BOTTOM NAV */
        .modern-nav { 
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: white; width: 90%; max-width: 400px;
            display: flex; justify-content: space-around; padding: 15px; 
            border-radius: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            z-index: 1001; border: 1px solid var(--liberum-accent);
        }
        .nav-item-mobile { text-align: center; color: #aaa; text-decoration: none; font-size: 0.75rem; }
        .nav-item-mobile.active { color: var(--liberum-green); font-weight: bold; }
        .nav-item-mobile i { font-size: 1.4rem; display: block; margin-bottom: 2px; }

        .last-obs-badge { font-size: 0.7rem; padding: 5px 10px; border-radius: 10px; }
    </style>
</head>
<body>

<header class="hero-header">
    <h1 class="hero-title">Liberum Montessori Akademia</h1>
</header>

<div class="selection-container">
    <div class="dropdown text-center">
        <button class="btn btn-class-selector dropdown-toggle shadow" type="button" id="classSelectBtn" data-bs-toggle="dropdown">
            <span><i class="fas fa-chalkboard-teacher me-2"></i>Sınıf Seçiniz</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-3 p-2" id="classList" style="border-radius: 20px; width: 100%;"></ul>
    </div>
</div>

<div class="container px-4">
    <div id="welcomeMessage" class="text-center p-5">
        <i class="fas fa-seedling fa-3x text-success opacity-25 mb-3 d-block"></i>
        <h5 class="text-muted fw-bold">Hoş Geldiniz</h5>
        <p class="small text-muted">Lütfen gözlem girişi yapacağınız sınıfı seçin.</p>
    </div>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="studentContainer"></div>
</div>

<nav class="modern-nav">
    <a href="/" class="nav-item-mobile active"><i class="fas fa-th-large"></i><span>Panel</span></a>
    <a href="/ayarlar" class="nav-item-mobile"><i class="fas fa-user-gear"></i><span>Yönetim</span></a>
    <a href="/raporlar" class="nav-item-mobile"><i class="fas fa-chart-pie"></i><span>Raporlar</span></a>
</nav>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered p-3">
        <div class="modal-content shadow-lg">
            <div class="modal-header border-0 pb-0 px-4 pt-4">
                <h5 class="modal-title fw-bold text-success" id="selectedStudentName">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="lastObservations" class="mb-3 p-3 rounded-4 bg-light" style="font-size: 0.85rem; display:none; border: 1px dashed var(--liberum-gold);">
                    <div class="fw-bold text-success mb-2 small"><i class="fas fa-history me-1"></i> Son Gözlemler:</div>
                    <div id="obsHistoryContent"></div>
                </div>

                <label class="small fw-bold text-muted mb-1 ms-1">Gelişim Alanı</label>
                <select class="form-select mb-3 shadow-sm border-0 bg-light" id="areaSelect" onchange="filterLessonsByArea()" style="border-radius: 12px; padding: 12px;">
                    <option selected disabled>Alan Seçin...</option>
                    <option value="Günlük Yaşam">Günlük Yaşam</option>
                    <option value="Duyusal">Duyusal</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Dil">Dil</option>
                    <option value="Kültür">Kültür</option>
                </select>

                <label class="small fw-bold text-muted mb-1 ms-1">Materyal / Çalışma</label>
                <select class="form-select mb-4 shadow-sm border-0 bg-light" id="lessonList" style="border-radius: 12px; padding: 12px;">
                    <option selected disabled>Önce Alan Seçiniz...</option>
                </select>
                
                <div class="status-buttons">
                    <button class="btn btn-outline-info btn-status" onclick="saveQuickObservation('Sunuldu')">1. Sunuldu <i class="fas fa-eye"></i></button>
                    <button class="btn btn-outline-warning btn-status text-dark" onclick="saveQuickObservation('Çalışıyor')">2. Çalışıyor <i class="fas fa-sync"></i></button>
                    <button class="btn btn-outline-success btn-status" onclick="saveQuickObservation('Ustalaştı')">3. Ustalaştı <i class="fas fa-star"></i></button>
                </div>
                <textarea class="form-control mt-2 border-0 bg-light" id="obsNote" rows="2" placeholder="Özel not ekle..." style="border-radius: 15px;"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allLessons = []; 
let activeStudentId = null;

document.addEventListener('DOMContentLoaded', loadClasses);

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();
        const list = document.getElementById('classList');
        list.innerHTML = classes.map(c => `
            <li><a class="dropdown-item py-3 border-bottom" href="#" onclick="selectClass('${c._id}', '${c.className}')">
                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-bold">${c.className}</span>
                    <span class="text-muted small">${c.teacherName}</span>
                </div>
            </a></li>
        `).join('');
    } catch (err) { console.error("Sınıflar yüklenemedi:", err); }
}

async function selectClass(id, className) {
    document.getElementById('classSelectBtn').innerHTML = `<span><i class="fas fa-school me-2"></i>${className}</span>`;
    document.getElementById('welcomeMessage').classList.add('d-none');
    loadStudents(id);
}

async function loadStudents(classId) {
    const container = document.getElementById('studentContainer');
    container.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-grow text-success"></div></div>';
    try {
        const response = await fetch(`/api/students/${classId}`);
        const students = await response.json();
        container.innerHTML = students.map(s => {
            const initials = (s.firstName[0] || '') + (s.lastName[0] || '');
            const entryDate = s.enrollmentDate ? new Date(s.enrollmentDate).toLocaleDateString('tr-TR') : '-';
            
            return `
                <div class="col">
                    <div class="student-card p-3 d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                        <div class="avatar me-3 shadow-sm">${initials}</div>
                        <div>
                            <h6 class="mb-0 fw-bold text-dark">${s.firstName} ${s.lastName}</h6>
                            <small class="text-muted d-block">${s.ageInMonths || '?'} Aylık</small>
                            <small class="text-muted" style="font-size:0.7rem;"><i class="far fa-calendar-check me-1"></i>Kayıt: ${entryDate}</small>
                        </div>
                        <i class="fas fa-chevron-right ms-auto text-muted opacity-50"></i>
                    </div>
                </div>`;
        }).join('');
    } catch (err) { container.innerHTML = '<p class="text-center mt-5 text-danger">Bağlantı hatası!</p>'; }
}

async function openObservation(id, name) {
    activeStudentId = id;
    document.getElementById('selectedStudentName').innerText = name;
    
    try {
        const historyRes = await fetch(`/api/observations/student/${id}?limit=3`);
        const history = await historyRes.json();
        const historyDiv = document.getElementById('lastObservations');
        if (history.length > 0) {
            historyDiv.style.display = 'block';
            document.getElementById('obsHistoryContent').innerHTML = history.map(obs => `
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small text-truncate me-2">${obs.lesson ? obs.lesson.lessonName : 'Materyal'}</span>
                    <span class="badge bg-secondary last-obs-badge">${obs.status}</span>
                </div>`).join('');
        } else { historyDiv.style.display = 'none'; }

        const lessonRes = await fetch('/api/lessons');
        allLessons = await lessonRes.json();
        document.getElementById('areaSelect').selectedIndex = 0;
        document.getElementById('lessonList').innerHTML = '<option selected disabled>Önce Alan Seçiniz...</option>';
        document.getElementById('obsNote').value = '';

        new bootstrap.Modal(document.getElementById('observationModal')).show();
    } catch (err) { console.error(err); }
}

function filterLessonsByArea() {
    const selectedArea = document.getElementById('areaSelect').value;
    const lessonSelect = document.getElementById('lessonList');
    const filtered = allLessons.filter(l => l.area === selectedArea);
    
    lessonSelect.innerHTML = '<option selected disabled>Materyal Seçin...</option>';
    filtered.forEach(l => {
        lessonSelect.innerHTML += `<option value="${l._id}">${l.lessonName}</option>`;
    });
}

async function saveQuickObservation(status) {
    const lessonId = document.getElementById('lessonList').value;
    if(!lessonId || lessonId.includes("Seçiniz")) return alert("Lütfen bir materyal seçin!");

    const data = {
        student: activeStudentId,
        lesson: lessonId,
        status: status,
        notes: document.getElementById('obsNote').value,
        observationDate: new Date()
    };

    try {
        const res = await fetch('/api/observations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(res.ok) {
            alert("Gözlem başarıyla kaydedildi! ✅");
            bootstrap.Modal.getInstance(document.getElementById('observationModal')).hide();
        } else {
            alert("Kayıt sırasında bir hata oluştu.");
        }
    } catch (err) { console.error("API Hatası:", err); }
}
</script>
</body>
</html>
