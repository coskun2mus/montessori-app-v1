<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Arka plan için yumuşak kum beji/fildişi tonu */
        body { background-color: #fdfaf5; font-family: 'Nunito', sans-serif; color: #4a4a4a; }
        
        /* Kart Tasarımı */
        .montessori-card { 
            border: 1px solid #e9e0d2; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            background: #ffffff;
            height: 100%;
        }
        .montessori-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(74, 93, 78, 0.1);
            border-color: #4a5d4e;
        }

        /* Avatar Çemberi */
        .avatar {
            width: 45px;
            height: 45px;
            background-color: #d1d9cf;
            color: #4a5d4e;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 0.9rem;
        }

        /* Yan Menü */
        .sidebar { background: #4a5d4e; color: white; min-height: 100vh; box-shadow: 4px 0 10px rgba(0,0,0,0.05); }
        .nav-link { color: rgba(255,255,255,0.7); margin-bottom: 10px; border-radius: 8px; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; }
        
        .section-title { font-weight: 700; color: #2c3e50; border-bottom: 2px solid #e9e0d2; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block sidebar p-4 sticky-top">
            <div class="text-center mb-5">
                <i class="fas fa-leaf fa-2x mb-2 text-warning"></i>
                <h5 class="text-uppercase tracking-wider">Montessori App</h5>
            </div>
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link active" href="#"><i class="fas fa-th-large me-2"></i> Gözlem Paneli</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-user-friends me-2"></i> Öğrenciler</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-layer-group me-2"></i> Sınıflar</a></li>
                <li class="nav-item"><a class="nav-link" href="#"><i class="fas fa-file-invoice me-2"></i> Raporlar</a></li>
            </ul>
        </nav>

        <main class="col-md-10 p-4 p-md-5">
            <div class="row align-items-center mb-5">
                <div class="col-md-6">
                    <h2 class="section-title">Gözlem Kaydı</h2>
                    <p class="text-muted small">Bugün için gözlemlerinizi hızlıca kaydedin.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <label class="small fw-bold text-muted d-block mb-1">Sınıf Seçimi</label>
                    <select class="form-select d-inline-block w-auto shadow-sm border-0" style="min-width: 200px; border-radius: 10px;">
                        <option>Kelebekler Sınıfı</option>
                        <option>Arılar Sınıfı</option>
                        <option>Uğur Böcekleri Sınıfı</option>
                        <option>Yıldızlar Sınıfı</option>
                    </select>
                </div>
            </div>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
                
                <script>
                    const ogrenciler = [
                        "Ali Yılmaz", "Ayşe Demir", "Can Özkan", "Deniz Aktaş", 
                        "Elif Kaya", "Fatma Çelik", "Gökhan Aras", "Hale Şahin",
                        "İlker Bulut", "Jale Aydın", "Kaan Yıldız", "Leyla Mert",
                        "Murat Efe", "Nihan Koç", "Ozan Güler", "Pelin Işık"
                    ];
                    
                    ogrenciler.forEach(isim => {
                        const initials = isim.split(' ').map(n => n[0]).join('');
                        document.write(`
                            <div class="col">
                                <div class="card montessori-card p-3 shadow-sm" data-bs-toggle="modal" data-bs-target="#observationModal">
                                    <div class="d-flex align-items-center">
                                        <div class="avatar me-3">${initials}</div>
                                        <div>
                                            <h6 class="mb-0 fw-bold">${isim}</h6>
                                            <small class="text-muted" style="font-size: 0.75rem;">Son Giriş: Dün</small>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                    });
                </script>
                </div>
        </main>
    </div>
</div>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold">Çalışma</label>
                    <select class="form-select shadow-sm border-light">
                        <option>Pembe Kule</option>
                        <option>Sayı Kartları</option>
                        <option>Silindir Bloklar</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold">Durum</label>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-outline-info text-start py-2">1. Sunuldu</button>
                        <button class="btn btn-outline-warning text-start py-2">2. Üzerinde Çalışıyor</button>
                        <button class="btn btn-outline-success text-start py-2">3. Ustalaştı</button>
                    </div>
                </div>
                <div>
                    <label class="form-label small fw-bold">Notlar</label>
                    <textarea class="form-control border-light shadow-sm" rows="3" placeholder="Gözleminiz varsa buraya yazın..."></textarea>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-dark w-100 py-3 mt-2" style="border-radius: 12px;">Kaydet ve Kapat</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
