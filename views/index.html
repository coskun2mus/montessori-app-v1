<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<header class="hero-section">
    <div class="hero-content">
        <h1 class="school-title">Liberum Montessori Akademia</h1>
    </div>
</header>

<main class="container">
    <section class="selection-container">
        <div class="dropdown">
            <button class="btn-class-selector dropdown-toggle shadow-lg" type="button" id="classSelectBtn" data-bs-toggle="dropdown">
                <span><i class="fas fa-layer-group me-2"></i>Sınıf Seçiniz</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end border-0 mt-3 p-2" id="classList">
                </ul>
        </div>
    </section>

    <div id="welcomeMessage" class="text-center p-5 opacity-50">
        <i class="fas fa-seedling fa-3x mb-3 text-success d-block"></i>
        <h5>Hoş Geldiniz</h5>
        <p class="small">Lütfen işlem yapmak istediğiniz sınıfı seçin.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="studentContainer"></div>
</main>

<nav class="bottom-nav">
    <a href="/" class="nav-item active"><i class="fas fa-th-large"></i><span>Panel</span></a>
    <a href="/ayarlar" class="nav-item"><i class="fas fa-user-gear"></i><span>Yönetim</span></a>
    <a href="/raporlar" class="nav-item"><i class="fas fa-chart-pie"></i><span>Raporlar</span></a>
</nav>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 30px;">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="fw-bold text-success" id="selectedStudentName">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="lastObservations" class="mb-3 p-3 rounded-4 bg-light border-start border-warning border-4" style="display:none;">
                    <div class="fw-bold text-dark small mb-2"><i class="fas fa-history me-1"></i> Son Gözlemler:</div>
                    <div id="obsHistoryContent"></div>
                </div>

                <label class="small fw-bold text-muted mb-1 ms-1">Gelişim Alanı</label>
                <select class="form-select mb-3 custom-input" id="areaSelect" onchange="filterLessonsByArea()">
                    <option selected disabled>Alan Seçin...</option>
                    <option value="Günlük Yaşam">Günlük Yaşam</option>
                    <option value="Duyusal">Duyusal</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Dil">Dil</option>
                    <option value="Kültür">Kültür</option>
                </select>

                <label class="small fw-bold text-muted mb-1 ms-1">Materyal / Çalışma</label>
                <select class="form-select mb-4 custom-input" id="lessonList">
                    <option selected disabled>Önce Alan Seçiniz...</option>
                </select>
                
                <div class="d-grid gap-2">
                    <button class="btn btn-status btn-outline-info" style="border-radius: 15px; padding: 12px;" onclick="saveQuickObservation('Sunuldu')">1. Sunuldu <i class="fas fa-eye float-end"></i></button>
                    <button class="btn btn-status btn-outline-warning text-dark" style="border-radius: 15px; padding: 12px;" onclick="saveQuickObservation('Çalışıyor')">2. Çalışıyor <i class="fas fa-sync float-end"></i></button>
                    <button class="btn btn-status btn-outline-success" style="border-radius: 15px; padding: 12px;" onclick="saveQuickObservation('Ustalaştı')">3. Ustalaştı <i class="fas fa-star float-end"></i></button>
                </div>
                <textarea class="form-control mt-3 custom-input" id="obsNote" rows="2" placeholder="Not ekle..."></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allLessons = []; 
let activeStudentId = null;

document.addEventListener('DOMContentLoaded', loadClasses);

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();
        const list = document.getElementById('classList');
        list.innerHTML = classes.map(c => `
            <li>
                <a class="dropdown-item py-2 border-bottom" href="#" onclick="selectClass('${c._id}', '${c.className}')">
                    <div class="class-item-content">
                        <span class="class-name">${c.className}</span>
                        <span class="teacher-name">${c.teacherName || 'Öğretmen Atanmadı'}</span>
                    </div>
                </a>
            </li>
        `).join('');
    } catch (err) { console.error("Sınıflar yüklenemedi:", err); }
}

async function selectClass(id, className) {
    document.getElementById('classSelectBtn').innerHTML = `<span><i class="fas fa-school me-2"></i>${className}</span>`;
    document.getElementById('welcomeMessage').classList.add('d-none');
    loadStudents(id);
}

async function loadStudents(classId) {
    const container = document.getElementById('studentContainer');
    container.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-grow text-success"></div></div>';
    try {
        const response = await fetch(`/api/students/${classId}`);
        const students = await response.json();
        container.innerHTML = students.map(s => {
            const initials = (s.firstName[0] || '') + (s.lastName[0] || '');
            const entryDate = s.enrollmentDate ? new Date(s.enrollmentDate).toLocaleDateString('tr-TR') : '-';
            return `
                <div class="col">
                    <div class="student-card p-3 d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                        <div class="avatar shadow-sm me-3">${initials}</div>
                        <div class="flex-grow-1">
                            <h6 class="mb-0 fw-bold text-dark">${s.firstName} ${s.lastName}</h6>
                            <small class="text-muted d-block">${s.ageInMonths || '?'} Aylık</small>
                            <small class="text-muted" style="font-size:0.7rem;"><i class="far fa-calendar-check me-1"></i>Kayıt: ${entryDate}</small>
                        </div>
                        <i class="fas fa-chevron-right text-muted opacity-50"></i>
                    </div>
                </div>`;
        }).join('');
    } catch (err) { container.innerHTML = '<p class="text-center mt-5 text-danger">Hata!</p>'; }
}

async function openObservation(id, name) {
    activeStudentId = id;
    document.getElementById('selectedStudentName').innerText = name;
    try {
        const historyRes = await fetch(`/api/observations/student/${id}?limit=3`);
        const history = await historyRes.json();
        const historyDiv = document.getElementById('lastObservations');
        if (history.length > 0) {
            historyDiv.style.display = 'block';
            document.getElementById('obsHistoryContent').innerHTML = history.map(obs => `
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <span class="small text-truncate me-2">${obs.lesson ? obs.lesson.lessonName : 'Materyal'}</span>
                    <span class="badge bg-secondary" style="font-size:0.6rem;">${obs.status}</span>
                </div>`).join('');
        } else { historyDiv.style.display = 'none'; }

        const lessonRes = await fetch('/api/lessons');
        allLessons = await lessonRes.json();
        document.getElementById('areaSelect').selectedIndex = 0;
        document.getElementById('lessonList').innerHTML = '<option selected disabled>Önce Alan Seçiniz...</option>';
        document.getElementById('obsNote').value = '';
        new bootstrap.Modal(document.getElementById('observationModal')).show();
    } catch (err) { console.error(err); }
}

function filterLessonsByArea() {
    const selectedArea = document.getElementById('areaSelect').value;
    const lessonSelect = document.getElementById('lessonList');
    const filtered = allLessons.filter(l => l.area === selectedArea);
    lessonSelect.innerHTML = '<option selected disabled>Materyal Seçin...</option>';
    filtered.forEach(l => {
        lessonSelect.innerHTML += `<option value="${l._id}">${l.lessonName}</option>`;
    });
}

async function saveQuickObservation(status) {
    const lessonId = document.getElementById('lessonList').value;
    if(!lessonId || lessonId.includes("Seçiniz")) return alert("Materyal seçin!");
    const data = { student: activeStudentId, lesson: lessonId, status: status, notes: document.getElementById('obsNote').value, observationDate: new Date() };
    try {
        const res = await fetch('/api/observations', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
        if(res.ok) {
            alert("Gözlem kaydedildi! ✅");
            bootstrap.Modal.getInstance(document.getElementById('observationModal')).hide();
        }
    } catch (err) { console.error(err); }
}
</script>
</body>
</html>
