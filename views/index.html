<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

<header class="hero-section">
    <div class="hero-content">
        <h1 class="school-title">Liberum Montessori Akademia</h1>
    </div>
</header>

<main class="container">
    <section class="selection-container">
        <div class="dropdown">
            <button class="btn-class-selector dropdown-toggle" type="button" id="classSelectBtn" data-bs-toggle="dropdown">
                <span><i class="fas fa-layer-group me-2"></i>Sınıf Seçiniz</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end border-0 mt-2 p-2 shadow-sm" id="classList">
                </ul>
        </div>
    </section>

    <div id="welcomeMessage" class="text-center p-5 opacity-50">
        <i class="fas fa-seedling fa-3x mb-3 text-success d-block"></i>
        <h5>Hoş Geldiniz</h5>
        <p class="small">Lütfen işlem yapmak istediğiniz sınıfı seçin.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="studentContainer"></div>
</main>

<nav class="bottom-nav">
    <a href="/" class="nav-item active"><i class="fas fa-th-large"></i><span>Panel</span></a>
    <a href="/ayarlar" class="nav-item"><i class="fas fa-user-gear"></i><span>Yönetim</span></a>
    <a href="/raporlar" class="nav-item"><i class="fas fa-chart-pie"></i><span>Raporlar</span></a>
</nav>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0" style="border-radius: 8px;">
            <div class="modal-header border-0 px-4 pt-4">
                <h5 class="fw-bold text-success" id="selectedStudentName" style="color: var(--liberum-green) !important;">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div id="lastObservations" class="mb-3 p-3 rounded-2 bg-light border-start border-warning border-4" style="display:none;">
                    <div class="fw-bold text-dark small mb-2"><i class="fas fa-history me-1"></i> Son Gözlemler:</div>
                    <div id="obsHistoryContent"></div>
                </div>

                <label class="small fw-bold text-muted mb-1 ms-1">Gelişim Alanı</label>
                <select class="form-select mb-3 custom-input" id="areaSelect" onchange="filterLessonsByArea()">
                    <option selected disabled>Alan Seçin...</option>
                    <option value="Günlük Yaşam">Günlük Yaşam</option>
                    <option value="Duyusal">Duyusal</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Dil">Dil</option>
                    <option value="Kültür">Kültür</option>
                </select>

                <label class="small fw-bold text-muted mb-1 ms-1">Materyal / Çalışma</label>
                <select class="form-select mb-4 custom-input" id="lessonList">
                    <option selected disabled>Önce Alan Seçiniz...</option>
                </select>
                
                <!-- AI Görsel Analizi -->
                <div class="mb-3 p-3 rounded-2 bg-light border border-info">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="small fw-bold text-primary"><i class="fas fa-robot"></i> AI Asistan (Opsiyonel)</span>
                    </div>
                    <input type="file" id="aiPhotos" class="form-control form-control-sm mb-2" accept="image/*" multiple max="3">
                    <button class="btn btn-sm btn-outline-primary w-100" id="btnAnalyze" onclick="analyzePhotos()">Fotoğrafları Analiz Et <i class="fas fa-magic"></i></button>
                    <div id="aiResult" class="mt-2 small text-dark p-2 bg-white rounded border" style="display:none;"></div>
                </div>

                <div class="d-grid gap-2">
                    <button class="btn btn-status btn-sunuldu" onclick="saveQuickObservation('Sunuldu')">1. Sunuldu <i class="fas fa-eye float-end"></i></button>
                    <button class="btn btn-status btn-calisiyor" onclick="saveQuickObservation('Yönlendirme')">2. Yönlendirme <i class="fas fa-sync float-end"></i></button>
                    <button class="btn btn-status btn-calisiyor border-warning" onclick="saveQuickObservation('Hata Kontrolü')">3. Hata Kontrolü <i class="fas fa-search float-end"></i></button>
                    <button class="btn btn-status btn-ustalasti" onclick="saveQuickObservation('Ustalaştı')">4. Ustalaştı <i class="fas fa-star float-end"></i></button>
                </div>
                <textarea class="form-control mt-3 custom-input" id="obsNote" rows="2" placeholder="Not ekle..."></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allLessons = []; 
let activeStudentId = null;
let activeClassId = null; // Kayıt sonrası sınıfı korumak için ekledik
let currentAiSession = null; // AI Session Cache

document.addEventListener('DOMContentLoaded', loadClasses);

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();
        const list = document.getElementById('classList');
        list.innerHTML = classes.map(c => `
            <li>
                <a class="dropdown-item py-2 border-bottom" href="#" onclick="selectClass('${c._id}', '${c.className}')">
                    <div class="class-item-content">
                        <div class="class-name fw-bold" style="display:block;">${c.className}</div>
                        <div class="teacher-name text-muted small" style="display:block;">${c.teacherName || 'Öğretmen Atanmadı'}</div>
                    </div>
                </a>
            </li>
        `).join('');
    } catch (err) { console.error("Sınıflar yüklenemedi:", err); }
}

async function selectClass(id, className) {
    activeClassId = id; // Seçili sınıf ID'sini sakla
    document.getElementById('classSelectBtn').innerHTML = `<span><i class="fas fa-school me-2"></i>${className}</span>`;
    document.getElementById('welcomeMessage').classList.add('d-none');
    loadStudents(id);
}

async function loadStudents(classId) {
    const container = document.getElementById('studentContainer');
    container.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-grow text-success"></div></div>';
    try {
        const response = await fetch(`/api/students/${classId}`);
        const students = await response.json();
        container.innerHTML = students.map((s, idx) => {
            const initials = (s.firstName[0] || '') + (s.lastName[0] || '');
            const entryDate = s.enrollmentDate ? new Date(s.enrollmentDate).toLocaleDateString('tr-TR') : '-';
            const delayClass = idx < 6 ? `delay-${(idx % 5) + 1}` : '';
            return `
                <div class="col animate-up ${delayClass}">
                    <div class="student-card p-3 d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                        <div class="avatar shadow-sm me-3">${initials}</div>
                        <div class="flex-grow-1">
                            <h6 class="mb-0 fw-bold text-dark">${s.firstName} ${s.lastName}</h6>
                            <small class="text-muted d-block">${s.ageInMonths || '?'} Aylık</small>
                            <small class="text-muted" style="font-size:0.7rem;"><i class="far fa-calendar-check me-1"></i>Kayıt: ${entryDate}</small>
                        </div>
                        <i class="fas fa-chevron-right text-muted opacity-50"></i>
                    </div>
                </div>`;
        }).join('');
    } catch (err) { container.innerHTML = '<p class="text-center mt-5 text-danger">Hata!</p>'; }
}

function getScoreUI(score) {
    if (score === null || score === undefined) {
        return `<span class="score-badge score-none">—</span>`;
    }
    let tier, label;
    if      (score <= 3)  { tier = 'low';  label = '🔴'; }
    else if (score <= 7)  { tier = 'mid';  label = '🟡'; }
    else                  { tier = 'high'; label = '🟢'; }
    const pct = Math.min((score / 10) * 100, 100).toFixed(0);
    return `
        <div class="score-bar-wrap">
            <div class="score-bar-fill score-${tier}" style="width:${pct}%"></div>
        </div>
        <span class="score-badge score-${tier}">${label} ${score.toFixed(1)}</span>`;
}

async function openObservation(id, name) {
    activeStudentId = id;
    document.getElementById('selectedStudentName').innerText = name;
    try {
        const historyRes = await fetch(`/api/observations/student/${id}?limit=3`);
        const history = await historyRes.json();
        const historyDiv = document.getElementById('lastObservations');
        if (history.length > 0) {
            historyDiv.style.display = 'block';
            document.getElementById('obsHistoryContent').innerHTML = history.map(obs => `
                <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                    <span class="small text-truncate flex-grow-1">${obs.lesson ? obs.lesson.lessonName : 'Materyal'}</span>
                    <span class="badge bg-secondary" style="font-size:0.6rem;flex-shrink:0;">${obs.status}</span>
                    ${getScoreUI(obs.successScore)}
                </div>`).join('');
        } else { historyDiv.style.display = 'none'; }

        const lessonRes = await fetch('/api/lessons');
        allLessons = await lessonRes.json();
        document.getElementById('areaSelect').selectedIndex = 0;
        document.getElementById('lessonList').innerHTML = '<option selected disabled>Önce Alan Seçiniz...</option>';
        document.getElementById('obsNote').value = '';
        
        // Reset AI variables and UI
        currentAiSession = null;
        document.getElementById('aiPhotos').value = '';
        document.getElementById('aiResult').style.display = 'none';

        new bootstrap.Modal(document.getElementById('observationModal')).show();
    } catch (err) { console.error(err); }
}

function filterLessonsByArea() {
    const selectedArea = document.getElementById('areaSelect').value;
    const lessonSelect = document.getElementById('lessonList');
    const filtered = allLessons.filter(l => l.area === selectedArea);
    lessonSelect.innerHTML = '<option selected disabled>Materyal Seçin...</option>';
    filtered.forEach(l => {
        lessonSelect.innerHTML += `<option value="${l._id}">${l.lessonName}</option>`;
    });
}

async function saveQuickObservation(status) {
    const lessonId = document.getElementById('lessonList').value;
    const note = document.getElementById('obsNote').value;

    if(!lessonId || lessonId.includes("Seçiniz")) {
        return alert("⚠️ Lütfen önce bir materyal seçiniz!");
    }

    const data = { 
        student: activeStudentId, 
        lesson: lessonId, 
        status: status, 
        note: note,
        teacherName: "Arzu Hoca", 
        observationDate: new Date() 
    };

    if (currentAiSession) {
        data.photos = [currentAiSession];
    }

    try {
        const res = await fetch('/api/observations', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
        });
        
        const result = await res.json();

        if(res.ok) {
            alert("Gözlem başarıyla kaydedildi! ✅");
            
            // Modalı kapatıyoruz
            const modalElement = document.getElementById('observationModal');
            const modalInstance = bootstrap.Modal.getInstance(modalElement);
            if(modalInstance) modalInstance.hide();
            
            // Sınıf listesini tekrar yükleyerek öğretmeni aynı yerde tutuyoruz
            if(activeClassId) loadStudents(activeClassId); 
            
        } else {
            // Backend'den dönen özel hata mesajını (Mükerrer uyarısı gibi) gösterir
            alert("⚠️ " + (result.error || "Bir hata oluştu!"));
        }
    } catch (err) { 
        alert("❌ Sunucu hatası!");
    }
}

async function analyzePhotos() {
    const fileInput = document.getElementById('aiPhotos');
    if (!fileInput.files || fileInput.files.length === 0) return alert("Lütfen en az 1 fotoğraf seçin.");
    if (fileInput.files.length > 3) return alert("Maksimum 3 fotoğraf yükleyebilirsiniz.");

    const btn = document.getElementById('btnAnalyze');
    const resDiv = document.getElementById('aiResult');
    
    btn.innerHTML = 'Analiz Ediliyor... <i class="fas fa-spinner fa-spin"></i>';
    btn.disabled = true;
    resDiv.style.display = 'none';

    const formData = new FormData();
    for (let i = 0; i < fileInput.files.length; i++) {
        formData.append('photos', fileInput.files[i]);
    }

    try {
        const res = await fetch('/api/observations/ai-analyze', {
            method: 'POST',
            body: formData
        });
        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || "Hata oluştu");

        resDiv.style.display = 'block';
        resDiv.innerHTML = `<strong>Durum Önerisi:</strong> <span class="badge bg-primary">${data.aiAnalysis.status}</span><br>
                            <strong>Performans Skoru:</strong> ${data.aiAnalysis.successScore}/10.0<br>
                            <strong>AI Notu:</strong> <span class="text-muted">${data.aiAnalysis.notes}</span>`;
        
        currentAiSession = {
            sessionId: 'S-' + Date.now(),
            images: data.imageUrls.map(url => ({
                url: url,
                aiAnalysis: data.aiAnalysis
            })),
            sessionSummary: data.aiAnalysis.notes
        };

        // Otomatik not doldurma
        document.getElementById('obsNote').value = data.aiAnalysis.notes;

    } catch (e) {
        alert("Analiz hatası: " + e.message);
    } finally {
        btn.innerHTML = 'Fotoğrafları Analiz Et <i class="fas fa-magic"></i>';
        btn.disabled = false;
    }
}
</script>
</body>
</html>
