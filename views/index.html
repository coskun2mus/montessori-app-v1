<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia - Gözlem Paneli</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #fdfaf5; font-family: 'Nunito', sans-serif; padding-bottom: 80px; }
        
        /* LOGO VE HEADER ALANI */
        .hero-header {
            width: 100%; height: 220px;
            background: url('logo.png') no-repeat center center;
            background-size: contain; background-color: white;
            border-bottom: 3px solid #4a5d4e; margin-bottom: 20px;
        }

        .top-header { background: #4a5d4e; color: white; padding: 15px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin: -40px 15px 20px 15px; position: relative; z-index: 10; }
        .student-card { border: 1px solid #e9e0d2; border-radius: 15px; background: white; transition: all 0.2s; cursor: pointer; }
        .student-card:active { transform: scale(0.95); background: #f0f0f0; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item-mobile { text-align: center; color: #888; text-decoration: none; font-size: 0.8rem; flex: 1; }
        .nav-item-mobile.active { color: #4a5d4e; font-weight: bold; }
        .nav-item-mobile i { font-size: 1.2rem; display: block; margin-bottom: 2px; }
        
        .avatar { background: #e9e0d2; color: #4a5d4e; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; text-transform: uppercase; }
        .btn-status { padding: 12px; font-weight: bold; border-radius: 12px; margin-bottom: 8px; width: 100%; text-align: left; }
    </style>
</head>
<body>

<div class="hero-header"></div>

<div class="top-header">
    <div class="container d-flex justify-content-between align-items-center">
        <h5 class="mb-0 fw-bold">Gözlem Paneli</h5>
        <div class="dropdown">
            <button class="btn btn-sm btn-light dropdown-toggle shadow-sm" type="button" id="classSelectBtn" data-bs-toggle="dropdown">
                Sınıf Seçin
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" id="classList" style="border-radius: 12px;"></ul>
        </div>
    </div>
</div>

<div class="container px-3">
    <div id="welcomeMessage" class="text-center p-4">
        <i class="fas fa-leaf fa-2x text-muted opacity-50 mb-3 d-block"></i>
        <h6>Liberum Montessori Akademia</h6>
        <p class="small text-muted">Devam etmek için bir sınıf seçiniz.</p>
    </div>
    <div class="row row-cols-1 row-cols-md-2 g-3" id="studentContainer"></div>
</div>

<div class="bottom-nav">
    <a href="/" class="nav-item-mobile active"><i class="fas fa-th-large"></i> Paneller</a>
    <a href="/ayarlar" class="nav-item-mobile"><i class="fas fa-cog"></i> Ayarlar</a>
    <a href="/raporlar" class="nav-item-mobile"><i class="fas fa-chart-pie"></i> Raporlar</a>
</div>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered p-3">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="selectedStudentName">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <select class="form-select mb-2" id="areaSelect" onchange="filterLessonsByArea()" style="border-radius: 12px;">
                    <option selected disabled>Gelişim Alanı Seçin...</option>
                    <option value="Günlük Yaşam">Günlük Yaşam</option>
                    <option value="Duyusal">Duyusal</option>
                    <option value="Matematik">Matematik</option>
                    <option value="Dil">Dil</option>
                    <option value="Kültür">Kültür</option>
                </select>

                <select class="form-select mb-3" id="lessonList" style="border-radius: 12px;">
                    <option selected disabled>Çalışma Seçin...</option>
                </select>
                
                <div class="status-buttons">
                    <button class="btn btn-outline-info btn-status" onclick="saveQuickObservation('Sunuldu')">1. Sunuldu</button>
                    <button class="btn btn-outline-warning btn-status text-dark" onclick="saveQuickObservation('Çalışıyor')">2. Çalışıyor</button>
                    <button class="btn btn-outline-success btn-status" onclick="saveQuickObservation('Ustalaştı')">3. Ustalaştı</button>
                </div>
                <textarea class="form-control mt-2" id="obsNote" rows="2" placeholder="Not ekle (Opsiyonel)..." style="border-radius: 12px;"></textarea>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
let allLessons = []; 
let activeStudentId = null;

document.addEventListener('DOMContentLoaded', loadClasses);

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();
        const list = document.getElementById('classList');
        list.innerHTML = classes.map(c => `
            <li><a class="dropdown-item py-2" href="#" onclick="selectClass('${c._id}', '${c.className} (${c.teacherName})')">
                ${c.className} <span class="text-muted small">(${c.teacherName})</span>
            </a></li>
        `).join('');
    } catch (err) { console.error("Sınıflar yüklenemedi:", err); }
}

async function selectClass(id, name) {
    document.getElementById('classSelectBtn').innerText = name;
    document.getElementById('welcomeMessage').classList.add('d-none');
    loadStudents(id);
}

async function loadStudents(classId) {
    const container = document.getElementById('studentContainer');
    container.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-border text-success"></div></div>';
    try {
        const response = await fetch(`/api/students/${classId}`);
        const students = await response.json();
        container.innerHTML = students.map(s => {
            const initials = (s.firstName[0] || '') + (s.lastName[0] || '');
            const ageDisplay = s.ageInMonths !== null ? s.ageInMonths : '?';
            const entryDate = s.entryDate ? new Date(s.entryDate).toLocaleDateString('tr-TR') : 'Belirtilmemiş';
            
            return `
                <div class="col">
                    <div class="student-card p-3 shadow-sm d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                        <div class="avatar me-3">${initials}</div>
                        <div>
                            <h6 class="mb-0 fw-bold">${s.firstName} ${s.lastName}</h6>
                            <small class="text-muted d-block">${ageDisplay} Aylık</small>
                            <small class="text-muted" style="font-size:0.7rem;">Kayıt: ${entryDate}</small>
                        </div>
                    </div>
                </div>`;
        }).join('');
    } catch (err) { container.innerHTML = '<p class="text-center mt-5">Hata oluştu.</p>'; }
}

async function openObservation(id, name) {
    activeStudentId = id;
    document.getElementById('selectedStudentName').innerText = name;
    
    const lessonRes = await fetch('/api/lessons');
    allLessons = await lessonRes.json();
    
    document.getElementById('areaSelect').selectedIndex = 0;
    document.getElementById('lessonList').innerHTML = '<option selected disabled>Önce Alan Seçiniz...</option>';
    document.getElementById('obsNote').value = '';

    new bootstrap.Modal(document.getElementById('observationModal')).show();
}

function filterLessonsByArea() {
    const selectedArea = document.getElementById('areaSelect').value;
    const lessonSelect = document.getElementById('lessonList');
    const filtered = allLessons.filter(l => l.area === selectedArea);
    
    lessonSelect.innerHTML = '<option selected disabled>Çalışma Seçin...</option>';
    filtered.forEach(l => {
        lessonSelect.innerHTML += `<option value="${l._id}">${l.lessonName}</option>`;
    });
}

async function saveQuickObservation(status) {
    const lessonId = document.getElementById('lessonList').value;
    const note = document.getElementById('obsNote').value;
    if(!lessonId || lessonId.includes("Seçiniz")) return alert("Lütfen önce bir çalışma seçin!");

    const data = {
        student: activeStudentId,
        lesson: lessonId,
        status: status,
        notes: note,
        observedBy: "Admin" 
    };

    try {
        const res = await fetch('/api/observations', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });

        if(res.ok) {
            alert("Gözlem Başarıyla Kaydedildi! ✅");
            bootstrap.Modal.getInstance(document.getElementById('observationModal')).hide();
        } else {
            alert("Hata oluştu.");
        }
    } catch (err) { console.error(err); }
}
</script>
</body>
</html>
