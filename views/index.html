<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori - Gözlem Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #fdfaf5; font-family: 'Nunito', sans-serif; padding-bottom: 70px; }
        
        /* Üst Header */
        .top-header { background: #4a5d4e; color: white; padding: 15px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Öğrenci Kartları */
        .student-card { 
            border: 1px solid #e9e0d2; 
            border-radius: 15px; 
            background: white; 
            transition: all 0.2s;
            cursor: pointer;
        }
        .student-card:active { transform: scale(0.95); background: #f0f0f0; }

        /* ALT MENÜ (Seçenek A) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .nav-item-mobile {
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .nav-item-mobile.active { color: #4a5d4e; font-weight: bold; }
        .nav-item-mobile i { font-size: 1.2rem; display: block; margin-bottom: 2px; }

        /* Modal Düzenlemeleri */
        .btn-status { padding: 15px; font-weight: bold; border-radius: 12px; margin-bottom: 10px; width: 100%; text-align: left; }
    </style>
</head>
<body>

<div class="top-header mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fw-bold">Montessori App</h4>
        <div class="dropdown">
            <button class="btn btn-sm btn-light dropdown-toggle" type="button" id="classSelectBtn">
                Sınıf Seçin
            </button>
            <ul class="dropdown-menu shadow" id="classList">
                </ul>
        </div>
    </div>
</div>

<div class="container px-3">
    <div id="welcomeMessage" class="text-center p-5">
        <i class="fas fa-hand-pointer fa-3x text-muted mb-3"></i>
        <h5>Lütfen bir sınıf seçin</h5>
        <p class="small text-muted">Öğrencileri listelemek için yukarıdaki menüyü kullanın.</p>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 g-3" id="studentContainer">
        </div>
</div>

<div class="bottom-nav">
    <a href="/" class="nav-item-mobile active">
        <i class="fas fa-th-large"></i> Paneller
    </a>
    <a href="/ayarlar" class="nav-item-mobile">
        <i class="fas fa-cog"></i> Ayarlar
    </a>
    <a href="#" class="nav-item-mobile">
        <i class="fas fa-chart-pie"></i> Raporlar
    </a>
</div>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered p-3">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="selectedStudentName">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <select class="form-select mb-3" id="lessonList">
                    <option selected disabled>Çalışma Seçin...</option>
                    </select>
                
                <div class="status-buttons">
                    <button class="btn btn-outline-info btn-status" onclick="selectStatus('Sunuldu')">1. Sunuldu</button>
                    <button class="btn btn-outline-warning btn-status" onclick="selectStatus('Çalışıyor')">2. Çalışıyor</button>
                    <button class="btn btn-outline-success btn-status" onclick="selectStatus('Ustalaştı')">3. Ustalaştı</button>
                </div>

                <textarea class="form-control mt-2" id="obsNote" rows="2" placeholder="Not ekle (Opsiyonel)..."></textarea>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-dark w-100 py-3" style="border-radius: 15px;">KAYDET</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- BURASI YARININ SİHİRLİ KODLARININ YERİ ---
    // API'den sınıfları ve öğrencileri çekme işlemleri burada yapılacak.
</script>

</body>
</html>
