<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --liberum-green: #4a5d4e;
            --liberum-gold: #c5a059;
            --liberum-beige: #fdfaf5;
            --liberum-dark: #2c3e50;
        }

        body { 
            background-color: var(--liberum-beige); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 100px;
        }

        /* HEADER & LOGO ALANI */
        .hero-header {
            background: linear-gradient(rgba(74, 93, 78, 0.8), rgba(74, 93, 78, 0.9)), 
                        url('https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            padding: 60px 20px;
            text-align: center;
            color: white;
            border-bottom: 5px solid var(--liberum-gold);
            margin-bottom: -40px;
        }

        .main-logo {
            width: 180px; /* Logo burada büyütüldü */
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            margin-bottom: 15px;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 5px;
        }

        .hero-subtitle {
            font-style: italic;
            opacity: 0.9;
            font-size: 1rem;
        }

        /* SINIF SEÇİMİ (MERKEZİ) */
        .selection-box {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .btn-class-selector {
            background-color: var(--liberum-green);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-class-selector:hover {
            background-color: #3d4d40;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }

        /* ÖĞRENCİ KARTLARI */
        .student-grid {
            margin-top: 60px;
        }

        .student-card {
            background: white;
            border-radius: 20px;
            border: none;
            border-left: 6px solid var(--liberum-gold);
            transition: all 0.3s ease;
            overflow: hidden;
            cursor: pointer;
        }

        .student-card:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .avatar-circle {
            width: 55px;
            height: 55px;
            background: var(--liberum-beige);
            color: var(--liberum-green);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
            border: 2px solid var(--liberum-gold);
        }

        /* ALT NAVİGASYON */
        .modern-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 30px;
            border-radius: 50px;
            display: flex;
            gap: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 1000;
            border: 1px solid rgba(74, 93, 78, 0.2);
        }

        .nav-link-custom {
            text-decoration: none;
            color: #777;
            text-align: center;
            transition: 0.3s;
        }

        .nav-link-custom.active { color: var(--liberum-green); font-weight: bold; }
        .nav-link-custom i { display: block; font-size: 1.4rem; }
        .nav-link-custom span { font-size: 0.75rem; }

    </style>
</head>
<body>

<div class="hero-header">
    <img src="logo.png" alt="Liberum Logo" class="main-logo"> <h1 class="hero-title">Liberum Montessori Akademia</h1>
    <p class="hero-subtitle">"Özgür Düşün, Özgür Ol"</p>
</div>

<div class="container">
    <div class="selection-box">
        <p class="text-center text-muted small mb-3">Devam etmek için bir sınıf seçiniz</p>
        <div class="dropdown">
            <button class="btn btn-class-selector dropdown-toggle" type="button" data-bs-toggle="dropdown" id="classBtn">
                <i class="fas fa-school"></i> Sınıf Listesi
            </button>
            <ul class="dropdown-menu dropdown-menu-end w-100 shadow-lg border-0 rounded-4" id="classList">
                </ul>
        </div>
    </div>

    <div id="studentContainer" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 student-grid px-3">
        </div>
</div>

<div class="modern-nav">
    <a href="/" class="nav-link-custom active"><i class="fas fa-th-large"></i><span>Paneller</span></a>
    <a href="/ayarlar" class="nav-link-custom"><i class="fas fa-user-gear"></i><span>Yönetim</span></a>
    <a href="/raporlar" class="nav-link-custom"><i class="fas fa-chart-line"></i><span>Raporlar</span></a>
</div>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-5">
            <div class="modal-header bg-light border-0 px-4 pt-4">
                <h5 class="fw-bold" id="selectedStudentName">Öğrenci Adı</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-center">
                <p class="text-muted">Gelişim alanını ve materyali seçerek gözlemi tamamlayın.</p>
                </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // MEVCUT JS FONKSİYONLARINI (loadClasses, loadStudents vb.) BURAYA OLDUĞU GİBİ YAPIŞTIR
    // Sadece 'classList' içine veri basarken 'dropdown-item' class'ını kullanmayı unutma.
</script>

</body>
</html>
