<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori - Gözlem Paneli</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #fdfaf5; font-family: 'Nunito', sans-serif; padding-bottom: 80px; }
        .top-header { background: #4a5d4e; color: white; padding: 15px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .student-card { border: 1px solid #e9e0d2; border-radius: 15px; background: white; transition: all 0.2s; cursor: pointer; }
        .student-card:active { transform: scale(0.95); background: #f0f0f0; }
        
        /* Alt Menü */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; box-shadow: 0 -2px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .nav-item-mobile { text-align: center; color: #888; text-decoration: none; font-size: 0.8rem; }
        .nav-item-mobile.active { color: #4a5d4e; font-weight: bold; }
        .nav-item-mobile i { font-size: 1.2rem; display: block; margin-bottom: 2px; }
        
        .avatar { background: #e9e0d2; color: #4a5d4e; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: bold; }
    </style>
</head>
<body>

<div class="top-header mb-4">
    <div class="container d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fw-bold">Montessori App</h4>
        <div class="dropdown">
            <button class="btn btn-sm btn-light dropdown-toggle" type="button" id="classSelectBtn" data-bs-toggle="dropdown" aria-expanded="false">
                Sınıf Seçin
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0" id="classList" style="border-radius: 12px;">
                </ul>
        </div>
    </div>
</div>

<div class="container px-3">
    <div id="welcomeMessage" class="text-center p-5">
        <i class="fas fa-hand-pointer fa-3x text-muted mb-3 d-block"></i>
        <h5>Lütfen bir sınıf seçin</h5>
        <p class="small text-muted">Öğrencileri listelemek için yukarıdaki menüyü kullanın.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 g-3" id="studentContainer"></div>
</div>

<div class="bottom-nav">
    <a href="/" class="nav-item-mobile active"><i class="fas fa-th-large"></i> Paneller</a>
    <a href="/ayarlar" class="nav-item-mobile"><i class="fas fa-cog"></i> Ayarlar</a>
    <a href="#" class="nav-item-mobile"><i class="fas fa-chart-pie"></i> Raporlar</a>
</div>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered p-3">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 25px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="selectedStudentName">Hızlı Gözlem</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                <p class="text-muted small">Bu öğrenci için gözlem kaydı oluşturun.</p>
                </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    loadClasses(); 
});

async function loadClasses() {
    try {
        const response = await fetch('/api/classes');
        const classes = await response.json();
        const list = document.getElementById('classList');

        list.innerHTML = ''; 

        classes.forEach(c => {
            const li = document.createElement('li');
            li.innerHTML = `<a class="dropdown-item py-2" href="#" onclick="selectClass('${c._id}', '${c.className}')">${c.className}</a>`;
            list.appendChild(li);
        });
    } catch (err) {
        console.error("Sınıflar yüklenemedi:", err);
    }
}

async function selectClass(id, name) {
    document.getElementById('classSelectBtn').innerText = name;
    document.getElementById('welcomeMessage').classList.add('d-none');
    loadStudents(id);
}

async function loadStudents(classId) {
    const container = document.getElementById('studentContainer');
    container.innerHTML = '<div class="text-center w-100 mt-5"><div class="spinner-border text-success"></div></div>';

    try {
        const response = await fetch(`/api/students/${classId}`);
        const students = await response.json();
        container.innerHTML = ''; 

        if(students.length === 0) {
            container.innerHTML = '<p class="text-center mt-5">Bu sınıfta henüz öğrenci yok.</p>';
            return;
        }

        students.forEach(s => {
            const initials = (s.firstName[0] || '') + (s.lastName[0] || '');
            container.innerHTML += `
                <div class="col">
                    <div class="student-card p-3 shadow-sm d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                        <div class="avatar me-3">${initials}</div>
                        <div>
                            <h6 class="mb-0 fw-bold">${s.firstName} ${s.lastName}</h6>
                            <small class="text-muted">${s.ageInMonths || '?'} Aylık</small>
                        </div>
                    </div>
                </div>
            `;
        });
    } catch (err) {
        container.innerHTML = '<p class="text-center mt-5">Hata: Öğrenciler yüklenemedi.</p>';
    }
}

function openObservation(id, name) {
    document.getElementById('selectedStudentName').innerText = name;
    const myModal = new bootstrap.Modal(document.getElementById('observationModal'));
    myModal.show();
}
</script>

</body>
</html>
