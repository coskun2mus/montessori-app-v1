<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum Montessori Akademia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --liberum-green: #2e7d32; --liberum-gold: #f9a825; }
        body { background-color: #fdfcfb; font-family: 'Poppins', sans-serif; margin: 0; padding-bottom: 70px; }
        
        /* Hero Section - Logoyu Tam Ekran Odak Yapar */
        .hero-banner {
            position: relative;
            width: 100%;
            height: 45vh; /* Ekranın yarısına yakını görsel */
            background: url('logo.png') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            color: white;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .hero-overlay {
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            width: 100%;
            padding: 40px 0 20px;
            text-align: center;
        }
        .hero-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 0; letter-spacing: 1px; }
        .hero-motto { font-style: italic; font-weight: 300; opacity: 0.9; }

        /* Seçim Alanı */
        .main-container { margin-top: -30px; position: relative; z-index: 10; }
        .class-picker-box {
            background: white;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        /* Buton Stilleri */
        .btn-liberum { 
            background-color: var(--liberum-green); 
            color: white; 
            border-radius: 50px; 
            padding: 12px 30px; 
            font-weight: 600;
            border: none;
            transition: all 0.3s;
        }
        .btn-liberum:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46,125,50,0.3); color: white; }

        /* Öğrenci Kartları */
        .student-card {
            background: white;
            border-radius: 20px;
            border: none;
            transition: 0.3s;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .student-card:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .avatar-circle {
            width: 50px; height: 50px;
            background: #e8f5e9; color: var(--liberum-green);
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-weight: bold;
        }

        /* Alt Navigasyon */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid #eee; z-index: 1000;
        }
        .nav-item { text-decoration: none; color: #aaa; text-align: center; font-size: 0.8rem; flex: 1; }
        .nav-item i { display: block; font-size: 1.4rem; margin-bottom: 2px; }
        .nav-item.active { color: var(--liberum-green); }
    </style>
</head>
<body>

<header class="hero-banner">
    <div class="hero-overlay">
        <h1 class="hero-title">Liberum Montessori Akademia</h1>
        <p class="hero-motto">"Özgür Düşün, Özgür Ol"</p>
    </div>
</header>

<div class="container main-container px-3">
    <div class="class-picker-box text-center">
        <div class="dropdown">
            <button class="btn btn-liberum btn-lg w-100 dropdown-toggle" type="button" id="classBtn" data-bs-toggle="dropdown">
                <i class="fas fa-chalkboard-teacher me-2"></i>Sınıf Seçiniz
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 w-100" id="classList" style="border-radius: 15px;">
                </ul>
        </div>
        <div id="selectedInfo" class="mt-2 d-none">
            <span class="badge bg-light text-success rounded-pill px-3 py-2 border">
                <i class="fas fa-check-circle me-1"></i> <span id="activeName"></span>
            </span>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 mt-4" id="studentContainer"></div>
</div>

<nav class="bottom-nav shadow-lg">
    <a href="/" class="nav-item active"><i class="fas fa-th-large"></i>Paneller</a>
    <a href="/ayarlar" class="nav-item"><i class="fas fa-cog"></i>Ayarlar</a>
    <a href="/raporlar" class="nav-item"><i class="fas fa-chart-pie"></i>Raporlar</a>
</nav>

<div class="modal fade" id="observationModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 30px;">
            <div class="modal-header border-0 pb-0 px-4 pt-4">
                <h5 class="fw-bold" id="selectedStudentName"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4" id="modalBody">
                </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Önceki kodundaki loadClasses ve loadStudents fonksiyonlarını buraya ekle. 
    // Sadece görsel kimlikleri (ID'leri) yukarıdakilerle eşleştirmen yeterli.
    
    async function loadClasses() {
        const res = await fetch('/api/classes');
        const classes = await res.json();
        const list = document.getElementById('classList');
        list.innerHTML = classes.map(c => `
            <li><a class="dropdown-item py-2" href="#" onclick="selectClass('${c._id}', '${c.className}')">${c.className}</a></li>
        `).join('');
    }

    async function selectClass(id, name) {
        document.getElementById('activeName').innerText = name;
        document.getElementById('selectedInfo').classList.remove('d-none');
        loadStudents(id);
    }

    async function loadStudents(classId) {
        const container = document.getElementById('studentContainer');
        container.innerHTML = '<div class="text-center w-100 p-5"><div class="spinner-border text-success"></div></div>';
        const res = await fetch(`/api/students/${classId}`);
        const students = await res.json();
        container.innerHTML = students.map(s => `
            <div class="col">
                <div class="student-card p-3 d-flex align-items-center" onclick="openObservation('${s._id}', '${s.firstName} ${s.lastName}')">
                    <div class="avatar-circle me-3">${(s.firstName[0] || '') + (s.lastName[0] || '')}</div>
                    <div>
                        <h6 class="mb-0 fw-bold">${s.firstName} ${s.lastName}</h6>
                        <small class="text-muted">${s.ageInMonths || '?'} Aylık</small>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadClasses);
</script>
</body>
</html>
