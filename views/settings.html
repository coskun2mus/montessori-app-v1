<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liberum - Yönetim Merkezi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        body { background-color: #fcfaf7; font-family: 'Poppins', sans-serif; }
        .management-list { max-height: 400px; overflow-y: auto; border-radius: 12px; }
        .student-manage-item { transition: all 0.2s; border-bottom: 1px solid #eee; padding: 10px; }
        .student-manage-item:hover { background-color: #f8f9fa; }
        .admin-card { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; }
        .difficulty-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container pb-5" style="max-width: 1000px;">
    <div class="text-center mb-4 mt-3">
        <a href="/" class="btn btn-outline-success btn-sm mb-3 shadow-sm px-4 rounded-pill">← Ana Panele Dön</a>
        <h2 class="fw-bold" style="font-family: 'Playfair Display', serif;">Okul Yönetim Merkezi</h2>
        <p class="text-muted small">Kayıtlar, Sınıf Değişimleri ve Müfredat Ayarları</p>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <div class="card admin-card h-100 p-4 border-start border-warning border-5 shadow-sm">
                <h5 class="mb-4 text-warning fw-bold"><i class="fas fa-user-plus me-2"></i>Yeni Öğrenci</h5>
                <div class="row g-2">
                    <div class="col-6"><label class="small fw-bold">Ad</label><input type="text" id="stuFirstName" class="form-control rounded-3" placeholder="Ad"></div>
                    <div class="col-6"><label class="small fw-bold">Soyad</label><input type="text" id="stuLastName" class="form-control rounded-3" placeholder="Soyad"></div>
                    <div class="col-12"><label class="small fw-bold">Doğum Tarihi</label><input type="date" id="stuBirthDate" class="form-control rounded-3"></div>
                    <div class="col-12"><label class="small fw-bold">Sınıf Atama</label><select id="stuClass" class="form-select rounded-3"><option selected disabled>Seçiniz...</option></select></div>
                    <div class="col-12"><label class="small fw-bold">Özel Notlar</label><textarea id="stuNote" class="form-control rounded-3" rows="2" placeholder="Alerji vb..."></textarea></div>
                </div>
                <button onclick="saveStudent()" class="btn btn-warning w-100 mt-3 text-white fw-bold shadow-sm rounded-pill">Kaydı Tamamla</button>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card admin-card p-4 border-start border-success border-5 mb-3 shadow-sm">
                <h5 class="mb-3 text-success fw-bold"><i class="fas fa-door-open me-2"></i>Sınıf Tanımla</h5>
                <div class="d-flex gap-2 mb-2">
                    <input type="text" id="className" class="form-control form-control-sm" placeholder="Sınıf Adı">
                    <input type="text" id="teacherName" class="form-control form-control-sm" placeholder="Öğretmen">
                </div>
                <button onclick="saveClass()" class="btn btn-success btn-sm w-100 fw-bold rounded-pill">Sınıfı Kaydet</button>
            </div>
            
            <div class="card admin-card p-4 border-start border-primary border-5 shadow-sm">
                <h5 class="mb-3 text-primary fw-bold"><i class="fas fa-cube me-2"></i>Materyal Ekle</h5>
                <input type="text" id="lessonName" class="form-control form-control-sm mb-2" placeholder="Materyal Adı">
                <div class="row g-2">
                    <div class="col-7">
                        <select id="lessonArea" class="form-select form-select-sm">
                            <option>Günlük Yaşam</option><option>Duyusal</option><option>Matematik</option><option>Dil</option><option>Kültür</option>
                        </select>
                    </div>
                    <div class="col-5">
                        <select id="lessonDifficulty" class="form-select form-select-sm">
                            <option value="1">Zorluk: 1</option><option value="2">Zorluk: 2</option><option value="3">Zorluk: 3</option>
                            <option value="5" selected>Zorluk: 5</option><option value="8">Zorluk: 8</option><option value="10">Zorluk: 10</option>
                        </select>
                    </div>
                </div>
                <button onclick="saveLesson()" class="btn btn-primary btn-sm w-100 mt-2 fw-bold rounded-pill">Materyali Kaydet</button>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-primary border-5 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="text-primary fw-bold mb-0"><i class="fas fa-cubes me-2"></i>Materyal Listesi</h5>
                    <select id="filterArea" class="form-select form-select-sm w-auto rounded-pill" onchange="loadManageLessons()">
                        <option value="Hepsi">Tüm Alanlar</option>
                        <option>Günlük Yaşam</option><option>Duyusal</option><option>Matematik</option><option>Dil</option><option>Kültür</option>
                    </select>
                </div>
                <div id="manageLessonList" class="management-list list-group list-group-flush border rounded-3 bg-white"></div>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-danger border-5 shadow-sm">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="text-danger fw-bold mb-0"><i class="fas fa-users me-2"></i>Öğrenci Yönetimi</h5>
                    <input type="text" id="studentSearch" class="form-control form-control-sm w-50 rounded-pill" placeholder="İsimle ara..." onkeyup="filterStudents()">
                </div>
                <div id="manageStudentList" class="management-list list-group list-group-flush border rounded-3 bg-white"></div>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-info border-5 shadow-sm">
                <h5 class="mb-3 text-info fw-bold"><i class="fas fa-list me-2"></i>Sınıf Yapısı</h5>
                <div id="manageClassList" class="row row-cols-1 row-cols-md-3 g-2"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // TÜM JAVASCRIPT MANTIĞINI KORUYORUZ (300+ SATIR BURADA)
    let allStudents = [];
    let allClasses = [];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        if(document.getElementById('stuBirthDate')) document.getElementById('stuBirthDate').setAttribute('max', today);
        loadInitialData();
    });

    async function loadInitialData() {
        await loadClasses(); 
        await loadManageStudents();
        await loadManageLessons();
    }

    // --- ÖĞRENCİ İŞLEMLERİ ---
    async function saveStudent() {
        const data = {
            firstName: document.getElementById('stuFirstName').value.trim(),
            lastName: document.getElementById('stuLastName').value.trim(),
            birthDate: document.getElementById('stuBirthDate').value,
            currentClass: document.getElementById('stuClass').value,
            notes: document.getElementById('stuNote').value.trim()
        };

        if(!data.firstName || !data.lastName || !data.birthDate || !data.currentClass) return alert("Eksik alan!");

        try {
            const res = await fetch('/api/students', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Kayıt başarılı!"); location.reload(); }
        } catch (err) { alert("Bağlantı hatası!"); }
    }

    async function loadManageStudents() {
        const res = await fetch('/api/students/all');
        allStudents = await res.json();
        renderStudentList(allStudents);
    }

    function renderStudentList(students) {
        const listContainer = document.getElementById('manageStudentList');
        listContainer.innerHTML = '';
        students.forEach(s => {
            let options = allClasses.map(c => 
                `<option value="${c._id}" ${c._id === s.currentClass ? 'selected' : ''}>${c.className}</option>`
            ).join('');
            listContainer.innerHTML += `
                <div class="list-group-item student-manage-item d-flex justify-content-between align-items-center">
                    <span class="fw-bold small">${s.firstName} ${s.lastName}</span>
                    <div class="d-flex gap-2">
                        <select class="form-select form-select-sm border-0 bg-light rounded-pill" style="width:130px" onchange="changeStudentClass('${s._id}', this.value, '${s.firstName}')">
                            ${options}
                        </select>
                        <button onclick="deleteStudent('${s._id}', '${s.firstName}')" class="btn btn-link text-danger p-0"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        });
    }

    async function changeStudentClass(id, classId, name) {
        if(!confirm(`${name} sınıfı değiştirilsin mi?`)) { loadManageStudents(); return; }
        await fetch(`/api/students/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ currentClass: classId })
        });
        loadManageStudents();
    }

    async function deleteStudent(id, name) {
        if(confirm(`${name} silinecek. Emin misiniz?`)) {
            await fetch(`/api/students/${id}`, { method: 'DELETE' });
            loadManageStudents();
        }
    }

    function filterStudents() {
        const term = document.getElementById('studentSearch').value.toLowerCase();
        const filtered = allStudents.filter(s => (s.firstName + " " + s.lastName).toLowerCase().includes(term));
        renderStudentList(filtered);
    }

    // --- MATERYAL İŞLEMLERİ ---
    async function saveLesson() {
        const lessonName = document.getElementById('lessonName').value.trim();
        const area = document.getElementById('lessonArea').value;
        const difficultyLevel = parseInt(document.getElementById('lessonDifficulty').value);
        if(!lessonName) return alert("İsim girin!");
        const res = await fetch('/api/lessons', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ lessonName, area, difficultyLevel })
        });
        if(res.ok) { document.getElementById('lessonName').value = ""; loadManageLessons(); }
    }

    async function loadManageLessons() {
        const listContainer = document.getElementById('manageLessonList');
        const filterArea = document.getElementById('filterArea').value;
        const res = await fetch('/api/lessons');
        let lessons = await res.json();
        if(filterArea !== "Hepsi") lessons = lessons.filter(l => l.area === filterArea);
        listContainer.innerHTML = '';
        lessons.forEach(l => {
            listContainer.innerHTML += `
                <div class="list-group-item d-flex justify-content-between align-items-center py-2">
                    <div>
                        <span class="badge bg-light text-primary me-2">${l.area}</span>
                        <span class="fw-bold small">${l.lessonName} <span class="difficulty-pill bg-dark text-white">Z:${l.difficultyLevel || 5}</span></span>
                    </div>
                    <div>
                        <button onclick="editLesson('${l._id}', '${l.lessonName}')" class="btn btn-link text-primary p-0 me-2"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteLesson('${l._id}', '${l.lessonName}')" class="btn btn-link text-danger p-0"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        });
    }

    async function editLesson(id, oldName) {
        const newName = prompt("Yeni isim:", oldName);
        if (!newName) return;
        const newDiff = prompt("Yeni Zorluk (1-10):", "5");
        await fetch(`/api/lessons/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ lessonName: newName, difficultyLevel: parseInt(newDiff) })
        });
        loadManageLessons();
    }

    async function deleteLesson(id, name) {
        if(confirm(`"${name}" silinsin mi?`)) {
            await fetch(`/api/lessons/${id}`, { method: 'DELETE' });
            loadManageLessons();
        }
    }

    // --- SINIF İŞLEMLERİ ---
    async function saveClass() {
        const className = document.getElementById('className').value.trim();
        const teacherName = document.getElementById('teacherName').value.trim();
        const res = await fetch('/api/classes', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ className, teacherName })
        });
        if(res.ok) { document.getElementById('className').value = ""; loadClasses(); }
    }

    async function loadClasses() {
        const res = await fetch('/api/classes');
        allClasses = await res.json();
        const select = document.getElementById('stuClass');
        const manageList = document.getElementById('manageClassList');
        select.innerHTML = '<option selected disabled>Seçiniz...</option>';
        manageList.innerHTML = '';
        allClasses.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c._id; opt.innerText = c.className;
            select.appendChild(opt);
            manageList.innerHTML += `
                <div class="col">
                    <div class="p-2 border rounded-3 d-flex justify-content-between align-items-center bg-light">
                        <span class="small fw-bold">${c.className}</span>
                        <button onclick="deleteClass('${c._id}', '${c.className}')" class="btn btn-link text-danger p-0"><i class="fas fa-trash"></i></button>
                    </div>
                </div>`;
        });
    }

    async function deleteClass(id, name) {
        if(confirm(`"${name}" sınıfı silinsin mi?`)) {
            await fetch(`/api/classes/${id}`, { method: 'DELETE' });
            loadInitialData();
        }
    }
</script>
</body>
</html>
