<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori - Yönetim Paneli</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        .management-list { max-height: 400px; overflow-y: auto; border-radius: 12px; }
        .student-manage-item { transition: all 0.2s; border-bottom: 1px solid #eee; }
        .student-manage-item:hover { background-color: #f8f9fa; }
        .admin-card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container pb-5" style="max-width: 900px;">
    <div class="text-center mb-4 mt-3">
        <a href="/" class="btn btn-outline-secondary btn-sm mb-3 shadow-sm px-3">← Ana Panele Dön</a>
        <h2 class="fw-bold">Okul Yönetim Merkezi</h2>
        <p class="text-muted small">Kayıtlar, Sınıf Değişimleri ve Sistem Ayarları</p>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-6">
            <div class="card admin-card h-100 p-4 border-start border-warning border-5">
                <h5 class="mb-4 text-warning fw-bold"><i class="fas fa-user-plus me-2"></i>Yeni Öğrenci</h5>
                <div class="row g-2">
                    <div class="col-6"><label class="small fw-bold">Ad</label><input type="text" id="stuFirstName" class="form-control" placeholder="Ad"></div>
                    <div class="col-6"><label class="small fw-bold">Soyad</label><input type="text" id="stuLastName" class="form-control" placeholder="Soyad"></div>
                    <div class="col-12"><label class="small fw-bold">Doğum Tarihi</label><input type="date" id="stuBirthDate" class="form-control" onkeydown="return false"></div>
                    <div class="col-12"><label class="small fw-bold">Sınıf Atama</label><select id="stuClass" class="form-select"><option selected disabled>Seçiniz...</option></select></div>
                </div>
                <button onclick="saveStudent()" class="btn btn-warning w-100 mt-3 text-white fw-bold shadow-sm">Kaydı Tamamla</button>
            </div>
        </div>

        <div class="col-12 col-lg-6">
            <div class="card admin-card p-4 border-start border-success border-5 mb-3">
                <h5 class="mb-3 text-success fw-bold"><i class="fas fa-door-open me-2"></i>Sınıf Tanımla</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="className" class="form-control form-control-sm" placeholder="Sınıf Adı">
                    <input type="text" id="teacherName" class="form-control form-control-sm" placeholder="Öğretmen">
                    <button onclick="saveClass()" class="btn btn-success btn-sm px-3">Ekle</button>
                </div>
            </div>
            
            <div class="card admin-card p-4 border-start border-primary border-5">
                <h5 class="mb-3 text-primary fw-bold"><i class="fas fa-cube me-2"></i>Materyal Ekle</h5>
                <input type="text" id="lessonName" class="form-control form-control-sm mb-2" placeholder="Materyal Adı">
                <div class="d-flex gap-2">
                    <select id="lessonArea" class="form-select form-select-sm">
                        <option>Günlük Yaşam</option><option>Duyusal</option><option>Matematik</option><option>Dil</option><option>Kültür</option>
                    </select>
                    <button onclick="saveLesson()" class="btn btn-primary btn-sm px-3">Ekle</button>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-danger border-5">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="text-danger fw-bold mb-0"><i class="fas fa-users me-2"></i>Öğrenci Yönetimi</h5>
                    <input type="text" id="studentSearch" class="form-control form-control-sm w-50" placeholder="İsimle öğrenci ara..." onkeyup="filterStudents()">
                </div>
                <div id="manageStudentList" class="management-list list-group list-group-flush">
                    <div class="text-center py-4"><div class="spinner-border text-danger"></div></div>
                </div>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-info border-5">
                <h5 class="mb-3 text-info fw-bold"><i class="fas fa-list me-2"></i>Sınıf Yönetimi</h5>
                <div id="manageClassList" class="row row-cols-1 row-cols-md-2 g-2">
                    </div>
            </div>
        </div>
    </div>
</div>

<script>
    let allStudents = [];
    let allClasses = [];

    document.addEventListener('DOMContentLoaded', () => {
        const today = new Date().toISOString().split('T')[0];
        const birthInput = document.getElementById('stuBirthDate');
        if(birthInput) birthInput.setAttribute('max', today);
        
        loadInitialData();
    });

    async function loadInitialData() {
        // Hata yönetimini buraya da ekleyelim ki biri çökerse diğeri çalışabilsin
        try {
            await loadClasses(); 
        } catch(e) { console.error("Sınıf yükleme hatası:", e); }

        try {
            await loadManageStudents();
        } catch(e) { console.error("Öğrenci yükleme hatası:", e); }
    }

    // --- SINIF İŞLEMLERİ ---
    async function loadClasses() {
        try {
            const res = await fetch('/api/classes');
            allClasses = await res.json();
            
            const select = document.getElementById('stuClass');
            const classManageList = document.getElementById('manageClassList');
            
            select.innerHTML = '<option selected disabled>Seçiniz...</option>';
            classManageList.innerHTML = ''; // Temizle

            // DİKKAT: Eski kodda burada allClasses.forEach dışındayken 'c' kullanılıyordu, sildim.

            allClasses.forEach(c => {
                // 1. Kayıt Dropdown doldur
                const opt = document.createElement('option');
                opt.value = c._id; 
                opt.innerText = c.className;
                select.appendChild(opt);

                // 2. Yönetim Kartlarını oluştur
                classManageList.innerHTML += `
                    <div class="col">
                        <div class="p-2 border rounded d-flex justify-content-between align-items-center bg-light shadow-sm">
                            <span><strong>${c.className}</strong> <small class="text-muted">(${c.teacherName})</small></span>
                            <div>
                                <button onclick="editClass('${c._id}', '${c.teacherName}')" class="btn btn-link text-primary p-0 me-2" title="Öğretmeni Güncelle"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteClass('${c._id}', '${c.className}')" class="btn btn-link text-danger p-0" title="Sınıfı Sil"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>`;
            });
        } catch (err) { 
            console.error("Sınıf yükleme hatası detay:", err); 
        }
    }

    async function loadManageStudents() {
        const listContainer = document.getElementById('manageStudentList');
        try {
            const res = await fetch('/api/students/all');
            if(!res.ok) throw new Error("Sunucu hatası: " + res.status);
            
            allStudents = await res.json();
            renderStudentList(allStudents);
        } catch (err) { 
            console.error("Öğrenci yüklenirken hata oluştu:", err);
            listContainer.innerHTML = `<div class="text-center text-danger p-3">Veriler çekilemedi: ${err.message}</div>`; 
        }
    }
function renderStudentList(students) {
    const listContainer = document.getElementById('manageStudentList');
    listContainer.innerHTML = '';

    if(!students || students.length === 0) {
        listContainer.innerHTML = '<p class="text-center py-3 text-muted">Henüz kayıtlı öğrenci yok.</p>';
        return;
    }

    students.forEach(s => {
        let options = allClasses.map(c => 
            `<option value="${c._id}" ${c._id === s.currentClass ? 'selected' : ''}>${c.className}</option>`
        ).join('');

        const fullName = `${s.firstName} ${s.lastName}`;

        listContainer.innerHTML += `
            <div class="list-group-item student-manage-item px-2 py-3">
                <div class="row align-items-center">
                    <div class="col-md-4">
                        <h6 class="mb-0 fw-bold">${fullName}</h6>
                    </div>
                    <div class="col-md-5">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-transparent border-0 small text-muted">Sınıf:</span>
                            <select class="form-select form-select-sm border-0 bg-light rounded" onchange="changeStudentClass('${s._id}', this.value, '${fullName}')">
                                ${options}
                            </select>
                        </div>
                    </div>
                    <div class="col-md-3 text-end">
                        <button onclick="deleteStudent('${s._id}', '${s.firstName}')" class="btn btn-sm text-danger border-0">
                            <i class="fas fa-user-slash"></i> Sil
                        </button>
                    </div>
                </div>
            </div>`;
    });
}
    // --- DİĞER FONKSİYONLAR (Aynı Kalabilir) ---
    async function saveStudent() {
        const data = {
            firstName: document.getElementById('stuFirstName').value.trim(),
            lastName: document.getElementById('stuLastName').value.trim(),
            birthDate: document.getElementById('stuBirthDate').value,
            currentClass: document.getElementById('stuClass').value
        };
        if(!data.firstName || !data.currentClass || !data.birthDate) return alert("Lütfen tüm zorunlu alanları doldurun!");
        
        const res = await fetch('/api/students', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if(res.ok) { 
            alert("✅ Öğrenci kaydedildi."); 
           loadManageStudents()
        } else {
            alert("⚠️ Hata: " + (result.error || "Öğrenci kaydedilemedi."));
        }
    }
// settings.html içindeki sınıf değiştirme fonksiyonun muhtemelen şuna benziyor:
async function changeStudentClass(studentId, newClassId, studentName) {
    const confirmChange = confirm(`${studentName} isimli öğrencinin sınıfını değiştirmek istediğinize emin misiniz?`);
    
    if (!confirmChange) {
        loadManageStudents(); // loadStudents değil, sendeki adı loadManageStudents
        return;
    }

    try {
        const res = await fetch(`/api/students/${studentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ currentClass: newClassId })
        });

        if (res.ok) {
            alert("✅ Sınıf başarıyla güncellendi! ✨");
            // Buraya dikkat: İşlem bitince fonksiyondan çıkıyoruz (return)
            loadManageStudents(); 
            return;
        } else {
            const errData = await res.json();
            alert("⚠️ Hata: " + (errData.error || "Güncelleme yapılamadı."));
        }
    } catch (err) {
        console.error("Hata:", err);
        alert("🚨 Bağlantı hatası!");
    }
}


async function editClass(id, currentTeacher) {
        const newTeacher = prompt("Yeni öğretmen ismini giriniz:", currentTeacher);
        if(!newTeacher || newTeacher.trim() === currentTeacher) return;
        const res = await fetch(`/api/classes/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ teacherName: newTeacher.trim() })
        });
        if(res.ok) { alert("✅ Güncellendi!"); loadClasses(); }
    }

    async function deleteClass(id, name) {
        if(!confirm(`"${name}" sınıfını silmek istediğinize emin misiniz?`)) return;
        const res = await fetch(`/api/classes/${id}`, { method: 'DELETE' });
        if(res.ok) loadInitialData();
    }

    async function deleteStudent(id, name) {
        if(!confirm(`${name} silinecek. Onaylıyor musunuz?`)) return;
        const res = await fetch(`/api/students/${id}`, { method: 'DELETE' });
        if(res.ok) loadManageStudents();
    }

    function filterStudents() {
        const term = document.getElementById('studentSearch').value.toLowerCase();
        const filtered = allStudents.filter(s => (s.firstName + " " + s.lastName).toLowerCase().includes(term));
        renderStudentList(filtered);
    }

    async function saveLesson() {
        const lessonName = document.getElementById('lessonName').value.trim();
        const area = document.getElementById('lessonArea').value;
        if(!lessonName) return alert("Materyal adı boş olamaz!");
        const res = await fetch('/api/lessons', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ lessonName, area })
        });
        if(res.ok) { alert("✅ Eklendi"); document.getElementById('lessonName').value = ""; }
        else { const r = await res.json(); alert("⚠️ " + r.error); }
    }

    async function saveClass() {
        const className = document.getElementById('className').value.trim();
        const teacherName = document.getElementById('teacherName').value.trim();
        if(!className) return alert("Sınıf adı boş olamaz!");
        const res = await fetch('/api/classes', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ className, teacherName }) 
        });
        const result = await res.json();
        if(res.ok) { alert("✅ Sınıf eklendi!"); loadClasses(); }
        else { alert("⚠️ " + result.error); }
    }
</script>
</body>
</html>
