<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Montessori - Ayarlar</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container" style="max-width: 800px;">
    <div class="text-center mb-4">
        <a href="/" class="btn btn-outline-secondary btn-sm mb-3 shadow-sm px-3">← Panele Dön</a>
        <h2>Okul Yönetimi</h2>
        <p class="text-muted small">Sınıf, Materyal ve Öğrenci tanımlamaları</p>
    </div>

    <div class="row g-3">
        <div class="col-12">
            <div class="card admin-card p-4 border-start border-warning border-5">
                <h5 class="mb-4 text-warning fw-bold"><i class="fas fa-user-plus me-2"></i>Öğrenci Kaydet</h5>
                <div class="row g-2">
                    <div class="col-6">
                        <label>Ad</label>
                        <input type="text" id="stuFirstName" class="form-control form-control-lg" placeholder="Örn: Mustafa">
                    </div>
                    <div class="col-6">
                        <label>Soyad</label>
                        <input type="text" id="stuLastName" class="form-control form-control-lg" placeholder="Örn: Coşkun">
                    </div>
   <div class="col-12 col-md-6">
    <label>Doğum Tarihi</label>
    <input type="date" id="stuBirthDate" class="form-control form-control-lg" onkeydown="return false">
</div>

<div class="col-12 col-md-6">
    <label>Okula Başlama Tarihi</label>
    <input type="date" id="stuEnrollDate" class="form-control form-control-lg" onkeydown="return false">
</div>
                    <div class="col-12">
                        <label>Atanacağı Sınıf</label>
                        <select id="stuClass" class="form-select form-select-lg">
                            <option selected disabled>Sınıf Seçin...</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label>Özel Not (Opsiyonel)</label>
                        <textarea id="stuNotes" class="form-control form-control-lg" rows="2" placeholder="Öğrenci hakkında kısa not..."></textarea>
                    </div>
                </div>
                <button onclick="saveStudent()" class="btn btn-warning btn-lg w-100 shadow mt-4 text-white">Öğrenciyi Kaydet</button>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-success border-5">
                <h5 class="mb-3 text-success fw-bold"><i class="fas fa-door-open me-2"></i>Sınıf Tanımla</h5>
                <input type="text" id="className" class="form-control form-control-lg mb-2" placeholder="Sınıf Adı (Örn: Arılar)">
                <input type="text" id="teacherName" class="form-control form-control-lg mb-3" placeholder="Sorumlu Öğretmen">
                <button onclick="saveClass()" class="btn btn-success btn-lg w-100 shadow">Sınıfı Kaydet</button>
            </div>
        </div>

        <div class="col-12">
            <div class="card admin-card p-4 border-start border-primary border-5">
                <h5 class="mb-3 text-primary fw-bold"><i class="fas fa-cube me-2"></i>Materyal Ekle</h5>
                <select id="lessonArea" class="form-select form-select-lg mb-2">
                    <option>Günlük Yaşam</option>
                    <option>Duyusal</option>
                    <option>Matematik</option>
                    <option>Dil</option>
                    <option>Kültür</option>
                </select>
                <input type="text" id="lessonName" class="form-control form-control-lg mb-3" placeholder="Materyal Adı (Örn: Pembe Kule)">
                <div class="mb-2">
                    <label>Zorluk (1-10)</label>
                    <input type="range" id="difficulty" class="form-range" min="1" max="10">
                </div>
                <button onclick="saveLesson()" class="btn btn-primary btn-lg w-100 shadow">Müfredata Ekle</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadClassesToSelect);

    async function loadClassesToSelect() {
        try {
            const res = await fetch('/api/classes');
            const classes = await res.json();
            const select = document.getElementById('stuClass');
            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c._id;
                opt.innerText = c.className;
                select.appendChild(opt);
            });
        } catch (err) { console.error("Sınıflar yüklenemedi"); }
    }

    async function saveStudent() {
        const data = {
            firstName: document.getElementById('stuFirstName').value,
            lastName: document.getElementById('stuLastName').value,
            birthDate: document.getElementById('stuBirthDate').value,
            enrollmentDate: document.getElementById('stuEnrollDate').value || undefined,
            currentClass: document.getElementById('stuClass').value,
            notes: document.getElementById('stuNotes').value
        };

        if(!data.firstName || !data.lastName || !data.birthDate || !data.currentClass) {
            return alert("Lütfen zorunlu alanları (Ad, Soyad, Doğum Tarihi, Sınıf) doldurun!");
        }

        const res = await fetch('/api/students', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        
        const result = await res.json();
        if(res.ok) {
            alert("Öğrenci Başarıyla Kaydedildi!");
            location.reload();
        } else {
            alert("Hata: " + (result.error || "Öğrenci kaydedilemedi."));
        }
    }

    async function saveClass() {
        const data = { 
            className: document.getElementById('className').value, 
            teacherName: document.getElementById('teacherName').value 
        };
        const res = await fetch('/api/classes', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
        });
        const result = await res.json();
        if(res.ok) { 
            alert("Sınıf Kaydedildi!"); 
            location.reload(); 
        } else {
            alert("Hata: " + (result.error || "Sınıf kaydedilemedi."));
        }
    }

    async function saveLesson() {
        const data = { 
            area: document.getElementById('lessonArea').value, 
            lessonName: document.getElementById('lessonName').value, 
            difficultyLevel: document.getElementById('difficulty').value 
        };
        const res = await fetch('/api/lessons', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify(data) 
        });
        const result = await res.json();
        if(res.ok) {
            alert("Materyal Eklendi!");
            location.reload();
        } else {
            alert("Hata: " + (result.error || "Materyal eklenemedi."));
        }
    }

document.addEventListener('DOMContentLoaded', () => {
    // 1. TARİH SINIRLARINI AYARLA
    const today = new Date().toISOString().split('T')[0];
    
    const birthInput = document.getElementById('stuBirthDate');
    const enrollInput = document.getElementById('stuEnrollDate');
    
    if(birthInput) {
        birthInput.setAttribute('max', today);
        // 20 yıl öncesi sınırı
        const minDate = new Date();
        minDate.setFullYear(minDate.getFullYear() - 20);
        birthInput.setAttribute('min', minDate.toISOString().split('T')[0]);
    }
    
    if(enrollInput) {
        enrollInput.setAttribute('max', today);
    }

    // 2. SINIFLARI YÜKLE (Mevcut fonksiyonun)
    loadClassesToSelect();
});

// loadClassesToSelect ve diğer fonksiyonların aşağıda aynen kalsın...    

</script>
</body>
</html>
